<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- 3D Isometric DualSource Cube / Prism -->
  <!-- Top Face (Decision Surface) -->
  <path d="M 32 14 L 49 23 L 32 32 L 15 23 Z" fill="url(#topFace)" opacity="0.95" />
  <!-- Left Face (Source 1 - Local/Fast) -->
  <path d="M 15 23 L 32 32 L 32 50 L 15 41 Z" fill="url(#leftFace)" />
  <!-- Right Face (Source 2 - Global/Cost) -->
  <path d="M 32 32 L 49 23 L 49 41 L 32 50 Z" fill="url(#rightFace)" />

  <!-- Edge highlights for 3D realism -->
  <path d="M 32 14 L 49 23 L 32 32 L 15 23 Z" stroke="#7dd3fc" stroke-width="0.8" stroke-linejoin="round" opacity="0.7" />
  <line x1="32" y1="32" x2="32" y2="50" stroke="#93c5fd" stroke-width="1.2" opacity="0.6" />

  <!-- Dual Stream Connectors (Supplier 1 & Supplier 2 converging to Decision Nexus) -->
  <path d="M 20 33 L 26 36 L 32 32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 44 33 L 38 36 L 32 32" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Nodes -->
  <!-- Source 1 Node -->
  <circle cx="20" cy="33" r="2.5" fill="#38bdf8" />
  <circle cx="20" cy="33" r="1.2" fill="#ffffff" />
  
  <!-- Source 2 Node -->
  <circle cx="44" cy="33" r="2.5" fill="#818cf8" />
  <circle cx="44" cy="33" r="1.2" fill="#ffffff" />

  <!-- Decision Nexus Hub (IQ Center) -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="1.8" fill="#0284c7" />

  <!-- Top IQ Spark / Pulse -->
  <circle cx="32" cy="23" r="1.8" fill="#ffffff" opacity="0.9" />
  <line x1="32" y1="23" x2="32" y2="32" stroke="#ffffff" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.75" />
</svg>
